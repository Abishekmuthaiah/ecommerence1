server.port=5001

# Application Name
spring.application.name=user-product-service

# MySQL Configuration (Reads from Environment Variables or .env with defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_users_products}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:abishek7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret and Expiration (30 days)
app.jwt.secret=${JWT_SECRET:super_secret_jwt_key_user_product_service_2026}
app.jwt.expiration-ms=2592000000

# Logging
logging.level.org.springframework=INFO
logging.level.com.nexura=INFO
