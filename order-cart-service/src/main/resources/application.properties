server.port=5002

# Application Name
spring.application.name=order-cart-service

# MySQL Configuration (Reads from Environment Variables or .env with defaults)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce_orders}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:abishek7}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration for MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# Inter-Service Communication
user-product-service.url=${USER_PRODUCT_SERVICE_URL:http://localhost:5001/api}

# Logging
logging.level.org.springframework=INFO
logging.level.com.nexura=INFO
